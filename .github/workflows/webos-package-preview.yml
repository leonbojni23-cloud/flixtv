name: Build FLIXTV webOS IPK

on:
  push:
    branches:
      - webos-cinevault-rebuild
    paths:
      - ".github/workflows/webos-package-preview.yml"

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout TV application
        uses: actions/checkout@v4
        with:
          ref: webos-cinevault-rebuild

      - name: Fetch the exact FLIXTV web logo from main
        run: |
          curl --fail --location --retry 3 \
            https://raw.githubusercontent.com/leonbojni23-cloud/flixtv/main/apps/web/flixtv-icon.PNG \
            --output "$RUNNER_TEMP/flixtv-icon.PNG"
          python3 - <<'PY'
          from pathlib import Path
          p = Path("/tmp/flixtv-icon.PNG")
          data = p.read_bytes()
          if not data.startswith(b"\x89PNG\r\n\x1a\n"):
              raise SystemExit("The repository logo is not a valid PNG")
          print(f"Exact main-branch logo downloaded: {len(data)} bytes")
          PY
        env:
          TMPDIR: /tmp

      - name: Assemble webOS package
        run: |
          set -euo pipefail
          ROOT="$GITHUB_WORKSPACE/package-root"
          APP="$ROOT/usr/palm/applications/com.boring.tvhome"
          mkdir -p "$APP/assets/icons" "$ROOT/usr/palm/packages/com.boring.tvhome" "$ROOT/DEBIAN"
          cp -a apps/webos/application/. "$APP/"
          python3 - <<'PY'
          from pathlib import Path
          from PIL import Image
          source = Path("/tmp/flixtv-icon.PNG")
          app = Path("package-root/usr/palm/applications/com.boring.tvhome")
          with Image.open(source) as image:
              image = image.convert("RGBA")
              if image.width != image.height:
                  raise SystemExit(f"Expected square application icon, got {image.size}")
              for name, size in (("icon80.png", 80), ("icon130.png", 130)):
                  image.resize((size, size), Image.Resampling.LANCZOS).save(
                      app / "assets/icons" / name, format="PNG", optimize=True
                  )
              image.save(app / "assets/icons/flixtv-icon.PNG", format="PNG", optimize=True)
          appinfo = app / "appinfo.json"
          import json
          data = json.loads(appinfo.read_text())
          data["version"] = "0.29.2"
          data["icon"] = "assets/icons/icon80.png"
          data["largeIcon"] = "assets/icons/icon130.png"
          appinfo.write_text(json.dumps(data, indent=2) + "\n")
          (app / "keys.js").write_text(
              'window.KEYS = { TMDB_KEY: "", TMDB_BASE_URL: '
              '"https://flixtv-webos-preview-production.up.railway.app/api/tmdb" };\n'
          )
          packageinfo = {
              "id": "com.boring.tvhome",
              "version": "0.29.2",
              "app": "com.boring.tvhome",
              "services": []
          }
          (Path("package-root/usr/palm/packages/com.boring.tvhome") / "packageinfo.json").write_text(
              json.dumps(packageinfo, indent=2) + "\n"
          )
          PY
          SIZE="$(du -sk "$ROOT/usr/palm" | cut -f1)"
          cat > "$ROOT/DEBIAN/control" <<EOF
          Package: com.boring.tvhome
          Version: 0.29.2
          Section: misc
          Priority: optional
          Architecture: all
          Installed-Size: $SIZE
          Maintainer: FLIXTV
          Description: FLIXTV streaming application for LG webOS TVs
           webOS-Package-Format-Version: 2
          EOF
          dpkg-deb --build --root-owner-group "$ROOT" "$GITHUB_WORKSPACE/com.boring.tvhome_0.29.2_all.ipk"
          dpkg-deb --info "$GITHUB_WORKSPACE/com.boring.tvhome_0.29.2_all.ipk"
          dpkg-deb --contents "$GITHUB_WORKSPACE/com.boring.tvhome_0.29.2_all.ipk" | grep -E 'icon(80|130)\.png|flixtv-icon'
          python3 - <<'PY'
          import hashlib, zipfile, subprocess
          p = "com.boring.tvhome_0.29.2_all.ipk"
          print("IPK SHA256:", hashlib.sha256(open(p, "rb").read()).hexdigest())
          PY

      - name: Upload installable IPK
        uses: actions/upload-artifact@v4
        with:
          name: FLIXTV-webOS-0.29.2
          path: com.boring.tvhome_0.29.2_all.ipk
          if-no-files-found: error
          retention-days: 14
