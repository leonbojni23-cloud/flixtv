name: Web syntax check
on:
  push:
    branches: [main, feature/boredflix-visual-parity]
    paths:
      - "apps/web/**"
      - ".github/workflows/web-syntax.yml"
  pull_request:
    branches: [main]
    paths:
      - "apps/web/**"
      - ".github/workflows/web-syntax.yml"
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Validate FLIXTV browser JavaScript
        run: |
          node --check apps/web/app.js
          node --check apps/web/boredflix-parity.js
