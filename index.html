<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#0e1014">
<title>TV Home</title>

<link rel="stylesheet" href="style.css" media="print" onload="this.media='all'">
<link rel="stylesheet" href="features/details.css" media="print" onload="this.media='all'">
<link rel="stylesheet" href="features/search.css" media="print" onload="this.media='all'">
<link rel="stylesheet" href="features/ambient.css" media="print" onload="this.media='all'">
<link rel="stylesheet" href="features/profiles.css" media="print" onload="this.media='all'">

<style>
html, body {
  width: 100%;
  height: 100%;
  margin: 0;
  padding: 0;
  background: #0e1014;
  overflow: hidden;
}

/* Cinematic startup screen */
#boot {
  position: fixed;
  inset: 0;
  z-index: 200;
  display: flex;
  align-items: center;
  justify-content: center;
  overflow: hidden;
  isolation: isolate;
  background:
    radial-gradient(ellipse at 50% 42%, rgba(104, 13, 25, .24), transparent 42%),
    linear-gradient(145deg, #09090b 0%, #111114 52%, #080809 100%);
  opacity: 1;
  transition: opacity .75s ease, visibility .75s ease;
}

#boot::before,
#boot::after {
  content: "";
  position: absolute;
  z-index: -1;
  width: min(72vw, 760px);
  aspect-ratio: 1;
  border-radius: 50%;
  pointer-events: none;
}

#boot::before {
  top: -48%;
  left: -20%;
  background: radial-gradient(circle, rgba(229, 9, 20, .15), transparent 68%);
}

#boot::after {
  right: -24%;
  bottom: -58%;
  background: radial-gradient(circle, rgba(120, 15, 28, .13), transparent 70%);
}

#boot.gone {
  opacity: 0;
  visibility: hidden;
  pointer-events: none;
}

#boot .mid {
  width: 100%;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding: 32px;
  transform: translateY(-2vh);
}

#boot .boot-brand {
  display: flex;
  align-items: center;
  gap: 5px;
  margin-bottom: 13px;
  color: #fff;
  font: 900 clamp(42px, 6vw, 76px)/.95 Arial, Helvetica, sans-serif;
  letter-spacing: -3px;
  text-shadow: 0 8px 36px rgba(0,0,0,.55);
}

#boot .boot-brand span {
  color: #f5f5f5;
}

#boot .boot-brand i {
  color: #e50914;
  font-style: normal;
}

#boot .boot-tagline {
  margin-bottom: 42px;
  color: rgba(255,255,255,.52);
  font: 500 13px/1.4 Arial, Helvetica, sans-serif;
  letter-spacing: 4px;
  text-transform: uppercase;
}

#boot .bar {
  width: min(260px, 62vw);
  height: 3px;
  overflow: hidden;
  border-radius: 10px;
  background: rgba(255,255,255,.13);
  box-shadow: 0 0 22px rgba(229,9,20,.12);
}

#boot .bar i {
  display: block;
  width: 38%;
  height: 100%;
  border-radius: inherit;
  background: linear-gradient(90deg, #a80710, #f6121d);
  box-shadow: 0 0 14px rgba(229,9,20,.55);
  animation: bootbar 1.55s cubic-bezier(.4,0,.2,1) infinite;
}

@keyframes bootbar {
  from { transform: translateX(-110%); }
  to { transform: translateX(285%); }
}

#bootmsg {
  min-height: 18px;
  margin-top: 19px;
  color: rgba(255,255,255,.46);
  font: 13px Arial, Helvetica, sans-serif;
  letter-spacing: .35px;
}

@media (prefers-reduced-motion: reduce) {
  #boot .bar i { animation-duration: 3.5s; }
  #boot { transition-duration: .01ms; }
}

/* Series view */
#series-view {
  position: fixed;
  inset: 0;
  z-index: 50;
  width: 100%;
  height: 100%;
  background: #0e1014;
  overflow: hidden;
}

/* Fullscreen video player */
#player-view {
  position: fixed;
  top: 0;
  left: 0;
  right: 0;
  bottom: 0;
  z-index: 999999;
  width: 100%;
  height: 100%;
  margin: 0;
  padding: 0;
  border: 0;
  background: #000;
  overflow: hidden;
}

#yapgrid-frame {
  display: block;
  position: absolute;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  margin: 0;
  padding: 0;
  border: 0;
  background: #000;
}

#player-loading {
  position: absolute;
  inset: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  color: #fff;
  font-family: Arial, sans-serif;
  font-size: 24px;
  background: #000;
  z-index: 1;
  pointer-events: none;
}

#player-loading[hidden] {
  display: none !important;
}

#player-back {
  position: absolute;
  top: 30px;
  left: 30px;
  z-index: 5;
  min-width: 112px;
  height: 54px;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 10px;
  padding: 0 17px 0 14px;
  border: 1px solid rgba(255,255,255,.18);
  border-radius: 999px;
  background: rgba(18,18,20,.72);
  color: #fff;
  box-shadow: 0 8px 28px rgba(0,0,0,.28);
  -webkit-backdrop-filter: blur(14px);
  backdrop-filter: blur(14px);
  font: 700 12px/1 Arial, Helvetica, sans-serif;
  letter-spacing: 1.7px;
  cursor: pointer;
  opacity: .96;
  transition: background .18s ease, border-color .18s ease, transform .18s ease;
  -webkit-tap-highlight-color: transparent;
}

#player-back svg {
  width: 21px;
  height: 21px;
  flex: none;
}

#player-back.focus,
#player-back:focus {
  outline: 3px solid rgba(255,255,255,.96);
  outline-offset: 4px;
  border-color: rgba(255,255,255,.65);
  background: rgba(35,35,38,.96);
  transform: scale(1.045);
}

#player-view[hidden],
#series-view[hidden] {
  display: none !important;
}

body.player-open {
  overflow: hidden;
}

</style>
</head>

<body>

<!-- Boot screen -->
<div id="boot" aria-label="Loading FLIXTV">
  <div class="mid">
    <div class="boot-brand"><span>FLIX</span><i>TV</i></div>
    <div class="boot-tagline">YOUR NEXT STORY STARTS HERE</div>
    <div class="bar"><i></i></div>
    <div id="bootmsg">Getting your shows ready…</div>
  </div>
</div>

<!-- Background -->
<div id="bg">
  <img id="bgA" alt="">
  <img id="bgB" alt="">
</div>

<img id="bgBlur" alt="">
<div id="shade"></div>

<!-- Header -->
<header id="top">

  <div class="avatar f" id="avatar"></div>

  <nav class="pill">
    <span class="tab f" data-tab="home">For you</span>
  </nav>

  <nav class="pill icons">
    <span class="ico f" data-act="settings">
      <svg viewBox="0 0 24 24">
        <path fill="currentColor" d="M19.4 13a7.5 7.5 0 0 0 0-2l2.1-1.6-2-3.5-2.5 1a7.4 7.4 0 0 0-1.7-1L15 3h-4l-.4 2.7a7.4 7.4 0 0 0-1.7 1l-2.5-1-2 3.5L6.6 11a7.5 7.5 0 0 0 0 2l-2.1 1.6 2 3.5 2.5-1c.5.4 1.1.7 1.7 1L11 21h4l.4-2.7c.6-.3 1.2-.6 1.7-1l2.5 1 2-3.5L19.4 13zM13 15.5a3.5 3.5 0 1 1 0-7 3.5 3.5 0 0 1 0 7z" transform="translate(-1 0)"/>
      </svg>
    </span>
  </nav>

  <span id="weather" class="f" data-act="weather" hidden></span>
  <div id="clock"></div>

</header>

<!-- Home -->
<main id="home">

  <section id="hero">
    <div id="heroSrc"></div>
    <h1 id="heroTitle"></h1>
    <div id="heroMeta"></div>
    <p id="heroSub"></p>
    <span id="heroBtn" class="f">Open</span>
    <div id="dots"></div>
  </section>

  <div id="rows"></div>

</main>

<!-- Legacy Apps view -->
<main id="apps" hidden>
  <h2>Your apps</h2>
  <div id="grid"></div>
</main>

<!-- Series and episodes -->
<main id="series-view" hidden></main>

<!-- YapGrid player -->
<main id="player-view" hidden>

  <div id="player-loading">
    Loading player...
  </div>

  <iframe
    id="yapgrid-frame"
    title="YapGrid Player"
    allow="autoplay; fullscreen; encrypted-media; picture-in-picture"
    allowfullscreen
    sandbox="allow-scripts allow-same-origin allow-forms allow-presentation"
    referrerpolicy="origin"
    frameborder="0">
  </iframe>

  <button id="player-back" class="f" type="button" aria-label="Back to title details">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M19 12H5M12 19l-7-7 7-7" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
    <span>BACK</span>
  </button>

</main>

<!-- Quick settings -->
<div id="qdim" hidden></div>

<div id="qpanel" hidden>
  <div id="quick">

    <div class="qrow qhead">

      <div class="qclock">
        <div id="qdate"></div>
        <div id="qtime"></div>
      </div>

      <span class="qbtn f" data-q="settings">
        <svg viewBox="0 0 24 24">
          <path fill="currentColor" d="M19.4 13a7.5 7.5 0 0 0 0-2l2.1-1.6-2-3.5-2.5 1a7.4 7.4 0 0 0-1.7-1L15 3h-4l-.4 2.7a7.4 7.4 0 0 0-1.7 1l-2.5-1-2 3.5L6.6 11a7.5 7.5 0 0 0 0 2l-2.1 1.6 2 3.5 2.5-1c.5.4 1.1.7 1.7 1L11 21h4l.4-2.7c.6-.3 1.2-.6 1.7-1l2.5 1 2-3.5L19.4 13zM13 15.5a3.5 3.5 0 1 1 0-7 3.5 3.5 0 0 1 0 7z" transform="translate(-1 0)"/>
        </svg>
      </span>

      <span class="avatar f qav" data-q="close"></span>

    </div>

    <div class="qrow">

      <span class="tile f" data-q="screensaver">
        <svg viewBox="0 0 24 24">
          <path fill="currentColor" d="M21 19V5a2 2 0 0 0-2-2H5a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2zM8.5 13.5l2.5 3 3.5-4.5 4.5 6H5l3.5-4.5z"/>
        </svg>
        <span class="tl"><b>Screensaver</b></span>
      </span>

      <span class="tile f" data-q="wifi">
        <svg viewBox="0 0 24 24">
          <path fill="currentColor" d="M12 21l3.6-4.8a6 6 0 0 0-7.2 0zM1 9l2 2a12.7 12.7 0 0 1 18 0l2-2A15.5 15.5 0 0 0 1 9zm4 4 2 2a7 7 0 0 1 10 0l2-2a9.9 9.9 0 0 0-14 0z"/>
        </svg>
        <span class="tl">
          <b>Wi-Fi</b>
          <small id="qwifi"></small>
        </span>
      </span>

    </div>

    <div class="qrow">

      <span class="tile f" data-q="screenoff">
        <svg viewBox="0 0 24 24">
          <path fill="currentColor" d="M21 3H3a2 2 0 0 0-2 2v11a2 2 0 0 0 2 2h7v2H8v2h8v-2h-2v-2h7a2 2 0 0 0 2-2V5a2 2 0 0 0-2-2zm0 13H3V5h18v11zM5.3 6.7l1.4-1.4 12 12-1.4 1.4z"/>
        </svg>
        <span class="tl">
          <b>Screen off</b>
          <small>Audio keeps playing</small>
        </span>
      </span>

      <span class="tile f" data-q="a11y">
        <svg viewBox="0 0 24 24">
          <path fill="currentColor" d="M12 2a2 2 0 1 1 0 4 2 2 0 0 1 0-4zm9 7h-6v13h-2v-6h-2v6H9V9H3V7h18v2z"/>
        </svg>
        <span class="tl"><b>Accessibility</b></span>
      </span>

    </div>

    <div class="qrow">

      <span class="tile f" data-q="audio">
        <svg viewBox="0 0 24 24">
          <path fill="currentColor" d="M12 3a9 9 0 0 0-9 9v7a2 2 0 0 0 2 2h3v-8H5v-1a7 7 0 0 1 14 0v1h-3v8h3a2 2 0 0 0 2-2v-7a9 9 0 0 0-9-9z"/>
        </svg>
        <span class="tl">
          <b>Audio output</b>
          <small id="qaudio"></small>
        </span>
      </span>

      <span class="tile f" data-q="bluetooth">
        <svg viewBox="0 0 24 24">
          <path fill="currentColor" d="M17.7 7.7 12 2h-1v7.6L6.4 5 5 6.4 10.6 12 5 17.6 6.4 19l4.6-4.6V22h1l5.7-5.7-4.3-4.3 4.3-4.3zM13 5.8l1.9 1.9L13 9.6V5.8zm1.9 10.5L13 18.2v-3.8l1.9 1.9z"/>
        </svg>
        <span class="tl">
          <b>Bluetooth</b>
          <small id="qbt"></small>
        </span>
      </span>

    </div>

    <div class="qrow qvol">
      <span class="tile f vbtn" data-q="voldown">&minus;</span>
      <div class="vlabel">Volume <b id="qvol">&ndash;</b></div>
      <span class="tile f vbtn" data-q="volup">+</span>
    </div>

    <div class="qrow">

      <span class="tile f" data-q="picture">
        <svg viewBox="0 0 24 24">
          <path fill="currentColor" d="M12 3a9 9 0 1 0 0 18 9 9 0 0 0 0-18zm1 15.9V5.1a7 7 0 0 1 0 13.8z"/>
        </svg>
        <span class="tl">
          <b>Picture</b>
          <small id="qpic"></small>
        </span>
      </span>

      <span class="tile f" data-q="sound">
        <svg viewBox="0 0 24 24">
          <path fill="currentColor" d="M3 9v6h4l5 5V4L7 9H3zm13.5 3A4.5 4.5 0 0 0 14 8v8a4.5 4.5 0 0 0 2.5-4zM14 3.2v2.1a7 7 0 0 1 0 13.4v2.1a9 9 0 0 0 0-17.6z"/>
        </svg>
        <span class="tl">
          <b>Sound mode</b>
          <small id="qsnd"></small>
        </span>
      </span>

    </div>

    <div class="qrow qvol">
      <span class="tile f vbtn" data-q="bldown">&minus;</span>
      <div class="vlabel">Brightness <b id="qbl">&ndash;</b></div>
      <span class="tile f vbtn" data-q="blup">+</span>
    </div>

    <div class="qrow qinputs" id="qinputs"></div>

    <div class="qfoot">TV Home</div>

  </div>
</div>

<!-- Settings -->
<div id="sdim" hidden></div>

<div id="spanel" hidden>
  <div id="settings"></div>
</div>

<!-- Toast -->
<div id="toast"></div>

<!-- Application scripts -->
<script src="keys.js"></script>
<script src="config.js"></script>

<!-- TMDB service: must load before app.js -->
<script src="services/tmdb.js"></script>

<script src="features/profiles.js"></script>
<script src="app.js"></script>

<!-- YapGrid player: load after app.js and before details.js -->
<script src="features/yapgrid-embed.js"></script>

<script src="features/details.js"></script>
<script src="features/search.js"></script>
<script src="features/ambient.js"></script>



</body>
</html>
