<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#090b10">
  <meta name="description" content="FLIXTV movies and TV shows">
  <title>FLIXTV</title>
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <header class="topbar">
    <a class="brand" href="#" aria-label="FLIXTV home"><span class="brand-mark">F</span><span class="brand-name">FLIX<span>TV</span></span></a>
    <nav class="desktop-nav" aria-label="Main navigation">
      <button class="nav-link active" data-page="home">Home</button>
      <button class="nav-link" data-page="movies">Movies</button>
      <button class="nav-link" data-page="shows">TV Shows</button>
    </nav>
    <div class="top-actions">
      <label class="searchbox" id="searchbox"><button type="button" class="search-trigger" id="search-trigger" aria-label="Focus search"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="10.8" cy="10.8" r="6.8"></circle><path d="m16 16 5 5"></path></svg></button><input id="search" type="search" placeholder="Search movies & shows" autocomplete="off" aria-label="Search movies and shows"></label>
    </div>
  </header>

  <main id="app">
    <section id="hero" class="hero">
      <div class="hero-backdrop hero-backdrop-a active" id="hero-bg-a"></div><div class="hero-backdrop hero-backdrop-b" id="hero-bg-b"></div>
      <div class="hero-content" id="hero-content"><span class="eyebrow" id="hero-eyebrow">FLIXTV ORIGINAL PICKS</span><h1 id="hero-title">Discover something great.</h1><p id="hero-overview">Movies and series, all in one place.</p><div class="hero-actions"><button class="primary-btn" id="hero-action">View details</button><div class="hero-controls"><button type="button" id="hero-prev" aria-label="Previous featured title">‹</button><button type="button" id="hero-next" aria-label="Next featured title">›</button></div></div></div>
    </section>
    <section id="search-results" class="content-section" hidden><div class="section-heading"><h2>Search results</h2><span id="search-count"></span></div><div class="card-grid" id="search-grid"></div></section>
    <div id="catalog">
      <section class="content-section"><div class="section-heading"><h2>Trending this week</h2></div><div class="poster-row" id="trending"></div></section>
      <section class="content-section"><div class="section-heading"><h2>Popular movies</h2></div><div class="poster-row" id="movies"></div></section>
      <section class="content-section"><div class="section-heading"><h2>Popular TV shows</h2></div><div class="poster-row" id="shows"></div></section>
    </div>
    <div id="notice" class="notice" role="status" hidden></div>
  </main>

  <nav class="mobile-nav" aria-label="Mobile navigation">
    <button class="active" data-page="home" aria-label="Home">
      <span class="nav-icon"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m3.5 10.8 8.5-7 8.5 7v9.1a1.6 1.6 0 0 1-1.6 1.6h-4.2v-6.2h-5.4v6.2H5.1a1.6 1.6 0 0 1-1.6-1.6z"/></svg></span><span class="nav-label">Home</span>
    </button>
    <button data-page="movies" aria-label="Movies">
      <span class="nav-icon"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="4" width="18" height="16" rx="2.5"/><path d="M7 4v16M17 4v16M3 9h4m-4 6h4m10-6h4m-4 6h4"/></svg></span><span class="nav-label">Movies</span>
    </button>
    <button data-page="shows" aria-label="Shows">
      <span class="nav-icon"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="4" width="18" height="13" rx="2.5"/><path d="m8 21 4-4 4 4M8 8h8m-8 4h5"/></svg></span><span class="nav-label">Shows</span>
    </button>
    <button id="mobile-search" aria-label="Search">
      <span class="nav-icon"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="10.8" cy="10.8" r="6.8"/><path d="m16 16 4.5 4.5"/></svg></span><span class="nav-label">Search</span>
    </button>
  </nav>

  <section class="modal" id="details-modal" aria-hidden="true">
    <div class="modal-backdrop" data-close="details"></div>
    <article class="details-sheet">
      <button class="close-btn" data-close="details" aria-label="Close">×</button>
      <div id="details-backdrop" class="details-backdrop"></div>
      <div class="details-body"><span class="eyebrow" id="details-type">TITLE</span><h2 id="details-title"></h2><div id="details-meta" class="muted"></div><p id="details-overview"></p><div class="detail-actions"><button id="play-title" class="primary-btn">▶ Play</button><button id="watch-trailer" class="secondary-btn" hidden>Trailer</button></div><div id="episode-controls" hidden><label>Season <select id="season-select"></select></label><label>Episode <select id="episode-select"></select></label><button id="play-episode" class="primary-btn">▶ Play episode</button></div></div>
    </article>
  </section>

  <section class="player-modal" id="player-modal" aria-hidden="true">
    <button class="player-close" id="player-close">← Back</button>
    <div class="content-intro" id="content-intro" aria-hidden="true"><div class="intro-copy"><div class="intro-kicker">FLIXTV · INFORMACION I PËRMBAJTJES</div><div class="intro-rating" id="intro-rating"></div><div class="intro-title" id="intro-title"></div><div class="intro-details" id="intro-details"></div><div class="intro-progress"><span></span></div><button type="button" id="intro-skip">KALO</button></div></div>
    <iframe id="yapgrid-frame" title="YapGrid player" src="about:blank" sandbox="allow-scripts allow-same-origin allow-forms allow-presentation" allow="autoplay; fullscreen; encrypted-media; picture-in-picture" allowfullscreen referrerpolicy="origin"></iframe>
  </section>


  <script src="./app.js"></script>
</body>
</html>
