<!doctype html>
<html lang="sq">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#101010"><title>BingeAPI Player Test</title>
<style>
*{box-sizing:border-box}body{margin:0;padding:24px;background:#101010;color:#f5f5f5;font:15px/1.5 system-ui,sans-serif}
main{max-width:1100px;margin:auto}h1{font-size:24px;margin:0 0 8px}.muted,.note{color:#999}
.controls{display:flex;flex-wrap:wrap;gap:8px;margin:18px 0}
button{border:1px solid #444;border-radius:10px;background:#222;color:white;padding:11px 14px;font:inherit;cursor:pointer}
button[aria-pressed=true]{background:#a71925;border-color:#e34a56}
.frame-wrap{overflow:hidden;border:1px solid #444;border-radius:14px;background:#000;position:relative;width:100%;aspect-ratio:16/9;min-height:300px}
iframe{position:absolute;inset:0;display:block;width:100%;height:100%;border:0;background:#000}
#status{margin-top:12px;padding:12px;border-radius:10px;background:#1b1b1b;color:#ddd;overflow-wrap:anywhere}
@media(max-width:600px){body{padding:14px}.frame-wrap{min-height:220px}}
</style></head>
<body><main>
<h1>BingeAPI Player Test</h1>
<p class="muted">Test i izoluar i BingeAPI. Player-i kryesor i FLIXTV nuk ndryshohet nga kjo faqe.</p>
<div class="controls">
<button data-mode="none" aria-pressed="true">Pa sandbox (rekomandohet)</button>
<button data-mode="scripts">Vetëm scripts</button>
<button data-mode="same-origin">Scripts + same-origin</button>
<button data-mode="extended">Sandbox extended</button>
<button data-mode="strict">Strict</button>
</div>
<div class="frame-wrap" id="player"></div>
<div id="status">Duke ngarkuar BingeAPI…</div>
<p class="note">BingeAPI pranon IMDb ose TMDB ID në endpoint-in /embed/movie/{id}. Testo fillimisht pa sandbox dhe pastaj krahaso sjelljen me sandbox.</p>
</main>
<script>
(()=> {
 const src="https://bingeapi.st/embed/movie/27205";
 const modes={
  none:{label:"Pa sandbox",sandbox:null},
  scripts:{label:"Vetëm allow-scripts",sandbox:"allow-scripts"},
  "same-origin":{label:"allow-scripts + allow-same-origin",sandbox:"allow-scripts allow-same-origin"},
  extended:{label:"Sandbox extended",sandbox:"allow-scripts allow-same-origin allow-forms allow-popups allow-presentation"},
  strict:{label:"Strict (sandbox bosh)",sandbox:""}
 };
 const player=document.getElementById("player"),status=document.getElementById("status");
 const buttons=[...document.querySelectorAll("button[data-mode]")];
 function load(mode){
  const cfg=modes[mode],frame=document.createElement("iframe");
  frame.title="BingeAPI movie player";
  frame.src=src;
  frame.allow="autoplay; fullscreen; picture-in-picture; encrypted-media";
  frame.allowFullscreen=true;
  frame.referrerPolicy="strict-origin-when-cross-origin";
  if(cfg.sandbox!==null) frame.setAttribute("sandbox",cfg.sandbox);
  player.replaceChildren(frame);
  status.textContent="Modaliteti: "+cfg.label+" | "+src;
  buttons.forEach(b=>b.setAttribute("aria-pressed",String(b.dataset.mode===mode)));
 }
 buttons.forEach(b=>b.addEventListener("click",()=>load(b.dataset.mode)));
 load("none");
})();
</script></body></html>
